# Horizon is a light design. Configure native widgets as well as the CSS so
# macOS/browser dark-mode preferences cannot produce white text on light cards.
[theme]
base = "light"
font = '"Segoe UI", "Helvetica Neue", Arial, sans-serif'
primaryColor = "#6554ad"
backgroundColor = "#f7f8fb"
secondaryBackgroundColor = "#ffffff"
textColor = "#354052"
borderColor = "#e3e5ed"

[theme.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f7f8fb"
textColor = "#354052"
